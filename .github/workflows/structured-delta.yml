name: Structured Delta prototype

on:
  push:
    paths:
      - "prototypes/structured-delta/**"
      - ".github/workflows/structured-delta.yml"
  pull_request:
    paths:
      - "prototypes/structured-delta/**"
      - ".github/workflows/structured-delta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: prototypes/structured-delta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ruff==0.16.10
      - run: ruff check . && ruff format --check .
      - run: python tools/verify_source.py
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python -m unittest discover -s experiments/tests -v
      - run: python tools/run_pilot.py --out artifacts/ci-pilot
